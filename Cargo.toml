[workspace]
members = ["crates/fict-compiler-oxc"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/fictjs/fict"
rust-version = "1.97.0"

[workspace.dependencies]
oxc = { version = "=0.139.0", default-features = false, features = [
  "ast_visit",
  "cfg",
  "codegen",
  "regular_expression",
  "semantic",
  "transformer",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
