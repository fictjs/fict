[package]
name = "fict-compiler-napi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
fict-compiler = { workspace = true, features = ["preview"] }
napi.workspace = true
napi-derive.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build.workspace = true

[dev-dependencies]
# Rust test binaries do not run inside Node, so resolve Node-API symbols lazily
# while compiling the N-API crate's pure conversion and panic-boundary tests.
napi = { workspace = true, features = ["dyn-symbols"] }
