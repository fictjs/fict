name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Changesets 2.x expects the npm 11 `npm info --json` object shape.
  NPM_VERSION: 11.18.0
  # Make every native artifact self-identify the exact release source revision.
  FICT_COMPILER_BUILD_REVISION: ${{ github.sha }}
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_ZIGBUILD_VERSION: 0.23.0
  ZIG_VERSION: 0.14.1

jobs:
  native-matrix:
    name: Prepare native compiler matrix
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      runtime: ${{ steps.matrix.outputs.runtime }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Cache pinned Rust advisory auditor
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install pinned Rust advisory auditor
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Audit locked Rust dependencies
        run: |
          test "$(cargo-audit --version)" = "cargo-audit ${CARGO_AUDIT_VERSION}"
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock

      - id: matrix
        name: Generate the accepted support matrix
        shell: bash
        run: |
          echo "build=$(node scripts/native-compiler-packages.mjs matrix --kind build)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(node scripts/native-compiler-packages.mjs matrix --kind runtime)" >> "$GITHUB_OUTPUT"

  native-build:
    name: Build native compiler packages (${{ matrix.target }})
    needs: native-matrix
    runs-on: ${{ matrix.runner }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Rust target
        run: rustup target add ${{ matrix.rustTarget }}

      - name: Install pinned Zig for musl targets
        if: matrix.musl
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/fict-zig"
          "${RUNNER_TEMP}/fict-zig/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement .github/requirements-zig-linux.txt
          test "$("${RUNNER_TEMP}/fict-zig/bin/python" -m ziglang version)" = "${ZIG_VERSION}"

      - name: Cache pinned cargo-zigbuild for musl targets
        if: matrix.musl
        id: cargo-zigbuild-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Install pinned cargo-zigbuild for musl targets
        if: ${{ matrix.musl && steps.cargo-zigbuild-cache.outputs.cache-hit != 'true' }}
        run: cargo install cargo-zigbuild --version "${CARGO_ZIGBUILD_VERSION}" --locked

      - name: Verify pinned cargo-zigbuild for musl targets
        if: matrix.musl
        shell: bash
        run: test "$(cargo-zigbuild --version)" = "cargo-zigbuild ${CARGO_ZIGBUILD_VERSION}"

      - name: Build target N-API binary
        if: ${{ !matrix.musl }}
        run: cargo build --release -p fict-compiler-napi --target ${{ matrix.rustTarget }}

      - name: Build target N-API binary with Zig
        if: matrix.musl
        shell: bash
        env:
          CARGO_ZIGBUILD_PYTHON_PATH: ${{ runner.temp }}/fict-zig/bin/python
          # Rust's musl targets default to static CRT, which does not support cdylib output.
          RUSTFLAGS: '-C target-feature=-crt-static'
        run: cargo zigbuild --release -p fict-compiler-napi --target ${{ matrix.rustTarget }}

      - name: Assemble checksummed platform tarball
        run: >-
          node scripts/native-compiler-packages.mjs bundle
          --target ${{ matrix.target }}
          --binary ${{ matrix.binary }}
          --revision ${{ github.sha }}
          --output "${{ runner.temp }}/native-package"

      - name: Verify assembled platform tarball
        run: >-
          node scripts/native-compiler-packages.mjs verify-bundle
          --target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-package"

      - name: Attest native binary and tarball provenance
        id: native-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/native-package/package/fict_compiler_napi.node
            ${{ runner.temp }}/native-package/*.tgz

      - name: Attest native binary SBOM
        id: native-sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/native-package/package/fict_compiler_napi.node
          sbom-path: ${{ runner.temp }}/native-package/package/fict-compiler-native.spdx.json

      - name: Retain offline attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.native-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.native-sbom-attestation.outputs.bundle-path }}
        run: >-
          node -e
          "const fs=require('node:fs'),path=require('node:path');
          fs.copyFileSync(process.env.PROVENANCE_BUNDLE,path.join(process.env.RUNNER_TEMP,'native-package','provenance.attestation.json'));
          fs.copyFileSync(process.env.SBOM_BUNDLE,path.join(process.env.RUNNER_TEMP,'native-package','sbom.attestation.json'))"

      - name: Verify signed native supply-chain bundle
        run: >-
          node scripts/native-compiler-packages.mjs verify-bundle
          --target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-package"
          --attestations required
          --sbom-closure true

      - name: Upload native platform package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fict-native-package-${{ matrix.target }}
          path: ${{ runner.temp }}/native-package
          if-no-files-found: error
          retention-days: 90

  native-runtime:
    name: Certify native compiler packages (${{ matrix.target }}, Node ${{ matrix.node }})
    needs: [native-matrix, native-build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-matrix.outputs.runtime) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download target platform package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fict-native-package-${{ matrix.target }}
          path: ${{ runner.temp }}/native-package

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: ${{ !matrix.musl }}
        with:
          version: 9.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: ${{ !matrix.musl }}
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install facade dependencies
        if: ${{ !matrix.musl }}
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript facade
        if: ${{ !matrix.musl }}
        run: pnpm --filter @fictjs/compiler build

      - name: Clean-install and execute ESM/CJS on the native host
        if: ${{ !matrix.musl }}
        run: >-
          node scripts/native-compiler-package-smoke.mjs
          --target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-package"
          --node-lane ${{ matrix.node }}
          --expected-revision ${{ github.sha }}
          --attestations required
          --evidence "${{ runner.temp }}/native-evidence/${{ matrix.target }}-node-${{ matrix.node }}.json"

      - name: Clean-install and execute ESM/CJS in musl
        if: matrix.musl
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/native-evidence"
          docker run --rm \
            -e CI=true \
            -e HUSKY=0 \
            -v "${PWD}:/workspace" \
            -v "${RUNNER_TEMP}/native-package:/native-package:ro" \
            -v "${RUNNER_TEMP}/native-evidence:/native-evidence" \
            -w /workspace \
            "${{ matrix.dockerImage }}" \
            sh -lc 'corepack enable && corepack prepare pnpm@9.1.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @fictjs/compiler build && node scripts/native-compiler-package-smoke.mjs --target "${{ matrix.target }}" --bundle /native-package --node-lane "${{ matrix.node }}" --expected-revision "${{ github.sha }}" --attestations required --evidence "/native-evidence/${{ matrix.target }}-node-${{ matrix.node }}.json"'

      - name: Upload native runtime evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fict-native-evidence-${{ matrix.target }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/native-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  native-certification:
    name: Certify complete native release unit
    needs: [native-build, native-runtime]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Download all certified native packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: fict-native-package-*
          path: ${{ runner.temp }}/native-packages

      - name: Download all native runtime evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: fict-native-evidence-*
          path: ${{ runner.temp }}/native-evidence
          merge-multiple: true

      - name: Verify published GitHub artifact attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t binaries < <(find "${RUNNER_TEMP}/native-packages" -type f -name fict_compiler_napi.node | sort)
          mapfile -t tarballs < <(find "${RUNNER_TEMP}/native-packages" -type f -name '*.tgz' | sort)
          test "${#binaries[@]}" -eq 8
          test "${#tarballs[@]}" -eq 8
          for binary in "${binaries[@]}"; do
            gh attestation verify "${binary}" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://slsa.dev/provenance/v1
            gh attestation verify "${binary}" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
          for tarball in "${tarballs[@]}"; do
            gh attestation verify "${tarball}" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://slsa.dev/provenance/v1
          done

      - name: Certify the complete native runtime evidence matrix
        run: >-
          node scripts/native-compiler-packages.mjs
          verify-runtime-evidence
          --evidence "${RUNNER_TEMP}/native-evidence"
          --artifacts "${RUNNER_TEMP}/native-packages"
          --revision "${GITHUB_SHA}"
          --attestations required
          --sbom-closure true
          --output "${RUNNER_TEMP}/native-certification.json"

      - name: Upload native release certification
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fict-native-certification-${{ github.sha }}
          path: ${{ runner.temp }}/native-certification.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Release
    if: github.event_name == 'push'
    needs: native-certification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Restore pinned Rust advisory auditor
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install pinned Rust advisory auditor
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Verify pinned Rust advisory auditor
        run: test "$(cargo-audit --version)" = "cargo-audit ${CARGO_AUDIT_VERSION}"

      - name: Install pinned npm for trusted publishing
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Verify trusted publishing toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "${NPM_VERSION}"

      - run: pnpm install

      - name: Verify NPM release plan
        run: |
          pnpm release:plan \
            --tag "${GITHUB_REF_NAME}" \
            --require-existing-packages \
            --output "${RUNNER_TEMP}/npm-publish-plan.json"

      - name: Upload NPM release plan
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-publish-plan-${{ github.ref_name }}
          path: ${{ runner.temp }}/npm-publish-plan.json
          if-no-files-found: warn
          retention-days: 90

      - name: Download all certified native packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: fict-native-package-*
          path: ${{ runner.temp }}/native-packages

      - name: Download native release certification
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fict-native-certification-${{ github.sha }}
          path: ${{ runner.temp }}/native-certification

      - name: Verify compiler release identity and frozen corpus
        run: >-
          node scripts/verify-compiler-release-unit.mjs
          --plan "${RUNNER_TEMP}/npm-publish-plan.json"
          --certification "${RUNNER_TEMP}/native-certification/native-certification.json"
          --artifacts "${RUNNER_TEMP}/native-packages"
          --revision "${GITHUB_SHA}"

      - name: Preflight the complete atomic native publish set
        run: >-
          node scripts/publish-native-compiler-packages.mjs
          --verify-only
          --plan "${RUNNER_TEMP}/npm-publish-plan.json"
          --artifacts "${RUNNER_TEMP}/native-packages"

      - name: Install Playwright browser for release e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify full release gate
        run: pnpm release:verify:clean

      - name: Recheck NPM release plan
        run: >-
          pnpm release:plan
          --tag "${GITHUB_REF_NAME}"
          --require-existing-packages
          --output "${RUNNER_TEMP}/npm-publish-plan.json"

      - name: Upload final NPM release plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-final-publish-plan-${{ github.ref_name }}
          path: ${{ runner.temp }}/npm-publish-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Build publishable packages in the release checkout
        run: pnpm build

      - name: Preflight and publish the dependency-ordered release set
        run: >-
          node scripts/publish-release-packages.mjs
          --publish
          --plan "${RUNNER_TEMP}/npm-publish-plan.json"
          --native-artifacts "${RUNNER_TEMP}/native-packages"
          --output "${RUNNER_TEMP}/release-tarballs"
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          CI: true

      - name: Upload checksummed release tarballs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-release-tarballs-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-tarballs
          if-no-files-found: warn
          retention-days: 90

      - name: Publish or verify GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_revision="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          test "${tag_revision}" = "${GITHUB_SHA}"

          release_assets=(
            "${RUNNER_TEMP}/native-certification/native-certification.json"
            "${RUNNER_TEMP}/npm-publish-plan.json"
            "${RUNNER_TEMP}/release-tarballs/release-artifacts.json"
          )
          for release_asset in "${release_assets[@]}"; do
            test -f "${release_asset}"
          done

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "false"
            test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)" = "false"
            gh release upload "${GITHUB_REF_NAME}" "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
