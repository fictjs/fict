name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_VERSION: 12.0.1

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install pinned npm for trusted publishing
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Verify trusted publishing toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "${NPM_VERSION}"

      - run: pnpm install

      - name: Install Playwright browser for release e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify full release gate
        run: BENCH_OUTPUT="${RUNNER_TEMP}/optimizer-bench.json" pnpm release:verify

      - name: Upload optimizer benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-optimizer-benchmark-${{ github.ref_name }}
          path: ${{ runner.temp }}/optimizer-bench.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish to NPM
        run: pnpm exec changeset publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          CI: true
