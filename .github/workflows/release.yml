name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Changesets 2.x expects the npm 11 `npm info --json` object shape.
  NPM_VERSION: 11.18.0
  # Make every native artifact self-identify the exact release source revision.
  FICT_COMPILER_BUILD_REVISION: ${{ github.sha }}
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  native-matrix:
    name: Prepare native compiler matrix
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      runtime: ${{ steps.matrix.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Rust advisory auditor
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install pinned Rust advisory auditor
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Audit locked Rust dependencies
        run: |
          test "$(cargo audit --version)" = "cargo-audit ${CARGO_AUDIT_VERSION}"
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock

      - id: matrix
        name: Generate the accepted support matrix
        shell: bash
        run: |
          echo "build=$(node scripts/native-compiler-packages.mjs matrix --kind build)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(node scripts/native-compiler-packages.mjs matrix --kind runtime)" >> "$GITHUB_OUTPUT"

  native-build:
    name: Build native compiler packages (${{ matrix.target }})
    needs: native-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install musl linker
        if: matrix.musl
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build target N-API binary
        run: |
          rustup target add ${{ matrix.rustTarget }}
          cargo build --release -p fict-compiler-napi --target ${{ matrix.rustTarget }}

      - name: Assemble checksummed platform tarball
        run: >-
          node scripts/native-compiler-packages.mjs bundle
          --target ${{ matrix.target }}
          --binary ${{ matrix.binary }}
          --output "${{ runner.temp }}/native-package"

      - name: Verify assembled platform tarball
        run: >-
          node scripts/native-compiler-packages.mjs verify-bundle
          --target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-package"

      - name: Upload native platform package
        uses: actions/upload-artifact@v4
        with:
          name: fict-native-package-${{ matrix.target }}
          path: ${{ runner.temp }}/native-package
          if-no-files-found: error
          retention-days: 90

  native-runtime:
    name: Certify native compiler packages (${{ matrix.target }}, Node ${{ matrix.node }})
    needs: [native-matrix, native-build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-matrix.outputs.runtime) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download target platform package
        uses: actions/download-artifact@v4
        with:
          name: fict-native-package-${{ matrix.target }}
          path: ${{ runner.temp }}/native-package

      - uses: pnpm/action-setup@v3
        if: ${{ !matrix.musl }}
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        if: ${{ !matrix.musl }}
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install facade dependencies
        if: ${{ !matrix.musl }}
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript facade
        if: ${{ !matrix.musl }}
        run: pnpm --filter @fictjs/compiler build

      - name: Clean-install and execute ESM/CJS on the native host
        if: ${{ !matrix.musl }}
        run: >-
          node scripts/native-compiler-package-smoke.mjs
          --target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-package"
          --node-lane ${{ matrix.node }}
          --expected-revision ${{ github.sha }}
          --evidence "${{ runner.temp }}/native-evidence/${{ matrix.target }}-node-${{ matrix.node }}.json"

      - name: Clean-install and execute ESM/CJS in musl
        if: matrix.musl
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/native-evidence"
          docker run --rm \
            -e CI=true \
            -e HUSKY=0 \
            -v "${PWD}:/workspace" \
            -v "${RUNNER_TEMP}/native-package:/native-package:ro" \
            -v "${RUNNER_TEMP}/native-evidence:/native-evidence" \
            -w /workspace \
            "${{ matrix.dockerImage }}" \
            sh -lc 'corepack enable && corepack prepare pnpm@9.1.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @fictjs/compiler build && node scripts/native-compiler-package-smoke.mjs --target "${{ matrix.target }}" --bundle /native-package --node-lane "${{ matrix.node }}" --expected-revision "${{ github.sha }}" --evidence "/native-evidence/${{ matrix.target }}-node-${{ matrix.node }}.json"'

      - name: Upload native runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: fict-native-evidence-${{ matrix.target }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/native-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  native-certification:
    name: Certify complete native release unit
    needs: [native-build, native-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download all certified native packages
        uses: actions/download-artifact@v4
        with:
          pattern: fict-native-package-*
          path: ${{ runner.temp }}/native-packages

      - name: Download all native runtime evidence
        uses: actions/download-artifact@v4
        with:
          pattern: fict-native-evidence-*
          path: ${{ runner.temp }}/native-evidence
          merge-multiple: true

      - name: Certify the complete native runtime evidence matrix
        run: >-
          node scripts/native-compiler-packages.mjs
          verify-runtime-evidence
          --evidence "${RUNNER_TEMP}/native-evidence"
          --artifacts "${RUNNER_TEMP}/native-packages"
          --revision "${GITHUB_SHA}"
          --output "${RUNNER_TEMP}/native-certification.json"

      - name: Upload native release certification
        uses: actions/upload-artifact@v4
        with:
          name: fict-native-certification-${{ github.sha }}
          path: ${{ runner.temp }}/native-certification.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Release
    if: github.event_name == 'push'
    needs: native-certification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Restore pinned Rust advisory auditor
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install pinned Rust advisory auditor
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Verify pinned Rust advisory auditor
        run: test "$(cargo audit --version)" = "cargo-audit ${CARGO_AUDIT_VERSION}"

      - name: Install pinned npm for trusted publishing
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Verify trusted publishing toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "${NPM_VERSION}"

      - run: pnpm install

      - name: Verify NPM release plan
        run: |
          pnpm release:plan \
            --tag "${GITHUB_REF_NAME}" \
            --require-existing-packages \
            --output "${RUNNER_TEMP}/npm-publish-plan.json"

      - name: Upload NPM release plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-publish-plan-${{ github.ref_name }}
          path: ${{ runner.temp }}/npm-publish-plan.json
          if-no-files-found: warn
          retention-days: 90

      - name: Download all certified native packages
        uses: actions/download-artifact@v4
        with:
          pattern: fict-native-package-*
          path: ${{ runner.temp }}/native-packages

      - name: Preflight the complete atomic native publish set
        run: >-
          node scripts/publish-native-compiler-packages.mjs
          --verify-only
          --plan "${RUNNER_TEMP}/npm-publish-plan.json"
          --artifacts "${RUNNER_TEMP}/native-packages"

      - name: Install Playwright browser for release e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify full release gate
        run: BENCH_OUTPUT="${RUNNER_TEMP}/optimizer-bench.json" pnpm release:verify:clean

      - name: Upload optimizer benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-optimizer-benchmark-${{ github.ref_name }}
          path: ${{ runner.temp }}/optimizer-bench.json
          if-no-files-found: warn
          retention-days: 90

      - name: Recheck NPM release plan
        run: >-
          pnpm release:plan
          --tag "${GITHUB_REF_NAME}"
          --require-existing-packages
          --output "${RUNNER_TEMP}/npm-publish-plan.json"

      - name: Upload final NPM release plan
        uses: actions/upload-artifact@v4
        with:
          name: npm-final-publish-plan-${{ github.ref_name }}
          path: ${{ runner.temp }}/npm-publish-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Build publishable packages in the release checkout
        run: pnpm build

      - name: Preflight and publish the dependency-ordered release set
        run: >-
          node scripts/publish-release-packages.mjs
          --publish
          --plan "${RUNNER_TEMP}/npm-publish-plan.json"
          --native-artifacts "${RUNNER_TEMP}/native-packages"
          --output "${RUNNER_TEMP}/release-tarballs"
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          CI: true

      - name: Upload checksummed release tarballs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-tarballs-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-tarballs
          if-no-files-found: warn
          retention-days: 90
