name: CI

env:
  FICT_COMPILER_BUILD_REVISION: ${{ github.sha }}
  CARGO_AUDIT_VERSION: 0.22.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  rust-fuzz:
    name: Rust Compiler Scheduled Fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-04-28 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Verify the independent fuzz dependency lock
        run: |
          node --test scripts/run-locked-fuzz.test.mjs
          node scripts/run-locked-fuzz.mjs --verify-lock

      - name: Build compiler fuzz targets
        run: |
          node scripts/run-locked-fuzz.mjs build compiler_pipeline
          node scripts/run-locked-fuzz.mjs build compiler_request_pipeline
          node scripts/run-locked-fuzz.mjs build state_provenance

      - name: Fuzz parser, HIR, and core passes
        run: >-
          node scripts/run-locked-fuzz.mjs run compiler_pipeline --
          -max_total_time=600 -timeout=10 -rss_limit_mb=4096

      - name: Fuzz the public compiler request pipeline
        run: >-
          node scripts/run-locked-fuzz.mjs run compiler_request_pipeline --
          -max_total_time=600 -timeout=10 -rss_limit_mb=4096

      - name: Fuzz structured state provenance
        run: >-
          node scripts/run-locked-fuzz.mjs run state_provenance --
          -max_total_time=600 -timeout=10 -rss_limit_mb=4096

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rust-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30

  rust-native:
    name: Rust + Native (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install

      - name: Cache pinned Rust advisory auditor
        if: matrix.node == '24'
        id: cargo-audit-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install pinned Rust advisory auditor
        if: matrix.node == '24' && steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Audit locked Rust dependencies
        if: matrix.node == '24'
        run: |
          test "$(cargo-audit --version)" = "cargo-audit ${CARGO_AUDIT_VERSION}"
          pnpm security:audit:rust

      - name: Verify pinned Rust workspace
        if: matrix.node == '24'
        run: |
          rustc --version
          cargo --version
          pnpm verify:rust-workspace

      - name: Typecheck compiler fuzz target on stable
        if: matrix.node == '24'
        run: pnpm test:compiler:fuzz-check

      - name: Build and smoke host native compiler
        run: pnpm test:compiler:native-host

      - name: Clean-install the host native package without Rust
        run: >-
          node scripts/native-compiler-package-smoke.mjs
          --host-binary target/release/fict_compiler_napi.node

      - name: Execute Rust compiler output against the runtime
        run: |
          pnpm --filter @fictjs/runtime build
          pnpm --filter fict build
          pnpm --filter @fictjs/ssr build
          node --test scripts/babel-compiler-cross-module-semantic-oracle.test.mjs scripts/babel-compiler-dom-semantic-oracle.test.mjs scripts/babel-compiler-semantic-oracle.test.mjs scripts/babel-compiler-source-map-oracle.test.mjs scripts/babel-compiler-ssr-semantic-oracle.test.mjs scripts/babel-compiler-tooling-semantic-oracle.test.mjs scripts/native-compiler-auto-extract.test.mjs scripts/native-compiler-build-id.test.mjs scripts/native-compiler-capability-expansions.test.mjs scripts/native-compiler-commonjs-runtime.test.mjs scripts/native-compiler-expression-deps.test.mjs scripts/native-compiler-legacy-options-audit.test.mjs scripts/native-compiler-optimizer-diff.test.mjs scripts/native-compiler-r006-audit.test.mjs scripts/native-compiler-reactive-accessors.test.mjs scripts/native-compiler-request-matrix.test.mjs scripts/native-compiler-runtime.test.mjs scripts/native-compiler-state-machine-name-collision.test.mjs scripts/native-compiler-vnode-props-order.test.mjs

      - name: Typecheck ESM and CommonJS native facades
        if: matrix.node == '24'
        run: pnpm test:compiler:native-types

  native-platform:
    name: Native Platform (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64-msvc
            runner: windows-2025
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and smoke the host native compiler
        run: pnpm test:compiler:native-host

      - name: Clean-install the host native package
        run: >-
          node scripts/native-compiler-package-smoke.mjs
          --host-binary target/release/fict_compiler_napi.node

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Verify NPM release configuration
        run: >-
          pnpm test:release-publish-plan &&
          pnpm test:release-verification &&
          pnpm test:compiler:native-package-contract &&
          pnpm test:compiler:rollout-state &&
          pnpm guardrails:compiler-capabilities &&
          pnpm guardrails:metadata-protocol

      - name: Audit production dependencies
        run: pnpm security:audit:prod

      - run: pnpm guardrails:compiler-complexity
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm guardrails:typecheck-config
      - run: pnpm typecheck:strict-candidate
      - run: pnpm typecheck
      - run: pnpm typecheck:tests

  strict-guarantee:
    name: Strict Guarantee Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm test:compiler:release-strict-scope
      - run: pnpm test:strict-guarantee
      - run: pnpm build:strict-guarantee
      - run: pnpm test:bundlers:strict-guarantee

  perf-guardrails:
    name: Performance Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - name: Run performance guardrails
        run: pnpm guardrails:perf

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - name: Run focused review regressions
        run: pnpm test:review-regressions
      - run: pnpm test:coverage

      - name: Merge package coverage reports
        run: |
          set -euo pipefail
          mkdir -p coverage
          find packages -type f -path '*/coverage/lcov.info' -print | sort > "${RUNNER_TEMP}/lcov-files"
          if [[ ! -s "${RUNNER_TEMP}/lcov-files" ]]; then
            echo "::error::No package LCOV reports were produced."
            exit 1
          fi
          xargs cat < "${RUNNER_TEMP}/lcov-files" > coverage/lcov.info
          test -s coverage/lcov.info

      - run: FICT_STRICT_GUARANTEE=1 pnpm test:bundlers

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - name: Run browser and real-application E2E
        id: e2e
        env:
          FICT_REAL_APP_SOAK_MS: ${{ github.event_name == 'schedule' && '180000' || '10000' }}
        run: pnpm test:e2e

      - name: Upload E2E failure diagnostics
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure-diagnostics-${{ github.sha }}
          path: |
            packages/fict/playwright-report
            packages/fict/test-results
            examples/real-apps/playwright-report
            examples/real-apps/test-results
          if-no-files-found: warn
          retention-days: 14

  test-opt-out:
    name: Test (Opt-out)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: pnpm test

  test-ssr-edge:
    name: Test SSR Edge Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @fictjs/runtime build
      - run: pnpm --filter @fictjs/ssr build
      - run: pnpm --filter @fictjs/ssr test:edge

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: pnpm test:runtime-package-smoke
      - run: pnpm test:runtime-bundler-smoke
      - run: pnpm --filter @fictjs/router test:package

      - name: Check bundle size
        run: pnpm size
