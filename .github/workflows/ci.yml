name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: pnpm typecheck

  strict-guarantee:
    name: Strict Guarantee Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm -C packages/compiler test -- reactivity-guarantee-contract.test.ts
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: FICT_STRICT_GUARANTEE=1 pnpm test:bundlers

  perf-guardrails:
    name: Performance Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @fictjs/compiler build
      - name: Run performance guardrails
        run: BENCH_OUTPUT="${RUNNER_TEMP}/optimizer-bench.json" pnpm guardrails:perf

      - name: Upload optimizer benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/optimizer-bench.json
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: pnpm test:coverage
      - run: FICT_STRICT_GUARANTEE=1 pnpm test:bundlers

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  test-opt-out:
    name: Test (Opt-out)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: FICT_OPT_CROSS_BLOCK_CONST=0 pnpm test

  test-ssr-edge:
    name: Test SSR Edge Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @fictjs/runtime build
      - run: pnpm --filter @fictjs/ssr build
      - run: pnpm --filter @fictjs/ssr test:edge

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build

      - name: Check bundle size
        run: pnpm size
