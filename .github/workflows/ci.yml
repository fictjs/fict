name: CI

env:
  FICT_COMPILER_BUILD_REVISION: ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  rust-fuzz:
    name: Rust Compiler Fuzz Smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-04-28 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Verify the independent fuzz dependency lock
        run: >-
          cargo +nightly-2026-04-28 metadata
          --manifest-path fuzz/Cargo.toml
          --locked --format-version 1 --no-deps

      - name: Build compiler fuzz targets
        run: cargo +nightly-2026-04-28 fuzz build compiler_pipeline

      - name: Fuzz parser, HIR, and core passes
        run: >-
          cargo +nightly-2026-04-28 fuzz run compiler_pipeline --
          -max_total_time=60 -timeout=10 -rss_limit_mb=4096

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30

  rust-native:
    name: Rust + Native (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install

      - name: Verify pinned Rust workspace
        if: matrix.node == '24'
        run: |
          rustc --version
          cargo --version
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          pnpm guardrails:rust-crates

      - name: Build and smoke host native compiler
        run: pnpm test:compiler:native-host

      - name: Clean-install the host native package without Rust
        run: >-
          node scripts/native-compiler-package-smoke.mjs
          --host-binary target/release/fict_compiler_napi.node

      - name: Execute Rust compiler output against the runtime
        run: |
          pnpm --filter @fictjs/runtime build
          pnpm --filter fict build
          node --test scripts/native-compiler-runtime.test.mjs

      - name: Typecheck ESM and CommonJS native facades
        if: matrix.node == '24'
        run: pnpm test:compiler:native-types

  compiler-rollout:
    name: Rust Compiler Rollout Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm test:compiler:rollout-state
      - run: pnpm test:babel-preset:deprecation
      - run: pnpm --filter @fictjs/runtime build
      - run: pnpm --filter fict build

      - name: Verify native Vite, Webpack, editor, and playground integrations
        run: |
          pnpm test:vite:native
          pnpm test:webpack:native
          pnpm test:playground:native
          pnpm test:vscode:native

      - name: Run Core runtime and strict-guarantee parity
        run: >-
          node scripts/compiler-runtime-parity-gate.mjs
          --native-path=target/release/fict_compiler_napi.node
          --output="${RUNNER_TEMP}/compiler-rollout/runtime.json"

      - name: Build a representative application with the Rust backend
        env:
          FICT_COMPILER_BACKEND: rust
          FICT_COMPILER_NATIVE_PATH: ${{ github.workspace }}/target/release/fict_compiler_napi.node
        run: pnpm --filter fict-example-real-apps... build

      - name: Run privacy-safe legacy/Rust shadow comparison
        run: >-
          node scripts/compiler-shadow-gate.mjs
          --native-path=target/release/fict_compiler_napi.node
          --allowlist=.github/compiler-shadow-allowlist.json
          --output="${RUNNER_TEMP}/compiler-rollout/shadow.json"

      - name: Drill whole-build Rust to legacy rollback
        run: >-
          node scripts/compiler-backend-rollback-drill.mjs
          --native-path=target/release/fict_compiler_napi.node
          --output="${RUNNER_TEMP}/compiler-rollout/rollback.json"

      - name: Gate large-project throughput and peak RSS
        env:
          BENCH_MODULES: ${{ github.event_name == 'schedule' && '1200' || github.event_name == 'pull_request' && '480' || '1000' }}
          BENCH_PROFILE: ${{ github.event_name == 'schedule' && 'max' || 'ci' }}
        run: >-
          node scripts/compiler-backend-bench.mjs
          --modules="${BENCH_MODULES}"
          --rows=10
          --samples=5
          --warmup=8
          --profile="${BENCH_PROFILE}"
          --native-path=target/release/fict_compiler_napi.node
          --output="${RUNNER_TEMP}/compiler-rollout/benchmark.json"

      - name: Certify candidate native package install and size
        run: >-
          node scripts/native-compiler-package-smoke.mjs
          --host-binary target/release/fict_compiler_napi.node
          --evidence "${RUNNER_TEMP}/compiler-rollout/package.json"

      - name: Upload raw rollout evidence
        uses: actions/upload-artifact@v4
        with:
          name: compiler-rollout-raw-evidence
          path: ${{ runner.temp }}/compiler-rollout/*.json
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Verify NPM release configuration
        run: >-
          pnpm test:release-publish-plan &&
          pnpm test:release-verification &&
          pnpm test:compiler:native-package-contract

      - name: Audit production dependencies
        run: pnpm security:audit:prod

      - run: pnpm guardrails:compiler-complexity
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm guardrails:typecheck-config
      - run: pnpm typecheck:strict-candidate
      - run: pnpm typecheck
      - run: pnpm typecheck:tests

  strict-guarantee:
    name: Strict Guarantee Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm test:strict-guarantee
      - run: pnpm build:strict-guarantee
      - run: pnpm test:bundlers:strict-guarantee

  perf-guardrails:
    name: Performance Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @fictjs/compiler build
      - name: Run performance guardrails
        run: BENCH_OUTPUT="${RUNNER_TEMP}/optimizer-bench.json" pnpm guardrails:perf

      - name: Upload optimizer benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/optimizer-bench.json
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - name: Run focused review regressions
        run: pnpm test:review-regressions
      - run: pnpm test:coverage

      - name: Merge package coverage reports
        run: |
          set -euo pipefail
          mkdir -p coverage
          find packages -type f -path '*/coverage/lcov.info' -print | sort > "${RUNNER_TEMP}/lcov-files"
          if [[ ! -s "${RUNNER_TEMP}/lcov-files" ]]; then
            echo "::error::No package LCOV reports were produced."
            exit 1
          fi
          xargs cat < "${RUNNER_TEMP}/lcov-files" > coverage/lcov.info
          test -s coverage/lcov.info

      - run: FICT_STRICT_GUARANTEE=1 pnpm test:bundlers

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - name: Run browser and real-application E2E
        env:
          FICT_REAL_APP_SOAK_MS: ${{ github.event_name == 'schedule' && '180000' || '10000' }}
        run: pnpm test:e2e

  test-opt-out:
    name: Test (Opt-out)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: FICT_OPT_CROSS_BLOCK_CONST=0 pnpm test

  test-ssr-edge:
    name: Test SSR Edge Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @fictjs/runtime build
      - run: pnpm --filter @fictjs/ssr build
      - run: pnpm --filter @fictjs/ssr test:edge

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: pnpm test:runtime-package-smoke
      - run: pnpm test:runtime-bundler-smoke
      - run: pnpm --filter @fictjs/router test:package

      - name: Check bundle size
        run: pnpm size

  compiler-rollout-finalize:
    name: Finalize Rust Compiler Rollout Candidate
    needs:
      - rust-fuzz
      - rust-native
      - compiler-rollout
      - lint
      - typecheck
      - strict-guarantee
      - perf-guardrails
      - test
      - e2e
      - test-opt-out
      - test-ssr-edge
      - build
    if: >-
      always() &&
      (needs['rust-fuzz'].result == 'success' || needs['rust-fuzz'].result == 'skipped') &&
      needs['rust-native'].result == 'success' &&
      needs['compiler-rollout'].result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs['strict-guarantee'].result == 'success' &&
      needs['perf-guardrails'].result == 'success' &&
      needs.test.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs['test-opt-out'].result == 'success' &&
      needs['test-ssr-edge'].result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - name: Download current rollout evidence
        uses: actions/download-artifact@v4
        with:
          name: compiler-rollout-raw-evidence
          path: ${{ runner.temp }}/compiler-rollout/current

      - name: Find the immediately previous rollout candidate attempt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: previous_candidate
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              per_page: 50,
            })
            const run = runs
              .filter(candidate => candidate.id < context.runId)
              .sort((left, right) => right.id - left.id)[0]
            if (run?.status === 'completed' && run.conclusion === 'success') {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: run.id,
                per_page: 100,
              })
              if (artifacts.some(artifact => artifact.name === 'compiler-rollout-candidate' && !artifact.expired)) {
                core.setOutput('run_id', String(run.id))
                return
              }
            }
            core.setOutput('run_id', '')

      - name: Download the previous rollout candidate
        if: steps.previous_candidate.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: compiler-rollout-candidate
          path: ${{ runner.temp }}/compiler-rollout/previous
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous_candidate.outputs.run_id }}

      - name: Bind required workflow job results
        env:
          COMPILER_ROLLOUT_NEEDS: ${{ toJSON(needs) }}
        run: >-
          node scripts/compiler-rollout-workflow-gate.mjs
          --output="${RUNNER_TEMP}/compiler-rollout/current/workflow-gate.json"

      - name: Seal candidate evidence
        run: |
          set -euo pipefail
          previous_args=()
          previous="${RUNNER_TEMP}/compiler-rollout/previous/candidate.json"
          if [[ -f "${previous}" ]] && node -e "const fs = require('node:fs'); const value = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(value.schemaVersion === 5 ? 0 : 1)" "${previous}"; then
            previous_args+=("--previous=${previous}")
          elif [[ -f "${previous}" ]]; then
            echo "::notice::The previous rollout candidate uses an incompatible schema; restarting the consecutive count."
          fi
          node scripts/compiler-rollout-candidate.mjs \
            --workflow-gate="${RUNNER_TEMP}/compiler-rollout/current/workflow-gate.json" \
            --shadow="${RUNNER_TEMP}/compiler-rollout/current/shadow.json" \
            --benchmark="${RUNNER_TEMP}/compiler-rollout/current/benchmark.json" \
            --runtime="${RUNNER_TEMP}/compiler-rollout/current/runtime.json" \
            --rollback="${RUNNER_TEMP}/compiler-rollout/current/rollback.json" \
            --package="${RUNNER_TEMP}/compiler-rollout/current/package.json" \
            --output="${RUNNER_TEMP}/compiler-rollout/current/candidate.json" \
            "${previous_args[@]}"

      - name: Upload finalized rollout candidate
        uses: actions/upload-artifact@v4
        with:
          name: compiler-rollout-candidate
          path: ${{ runner.temp }}/compiler-rollout/current/*.json
          if-no-files-found: error
          retention-days: 90
