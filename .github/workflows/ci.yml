name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-native:
    name: Rust + Native (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install

      - name: Verify pinned Rust workspace
        if: matrix.node == '24'
        run: |
          rustc --version
          cargo --version
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          pnpm guardrails:rust-crates

      - name: Build and smoke host native compiler
        run: pnpm test:compiler:native-host

      - name: Execute Rust compiler output against the runtime
        run: |
          pnpm --filter @fictjs/runtime build
          pnpm --filter fict build
          node --test scripts/native-compiler-runtime.test.mjs

      - name: Typecheck ESM and CommonJS native facades
        if: matrix.node == '24'
        run: pnpm test:compiler:native-types

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Verify NPM release configuration
        run: pnpm test:release-publish-plan && pnpm test:release-verification

      - name: Audit production dependencies
        run: pnpm security:audit:prod

      - run: pnpm guardrails:compiler-complexity
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm guardrails:typecheck-config
      - run: pnpm typecheck:strict-candidate
      - run: pnpm typecheck
      - run: pnpm typecheck:tests

  strict-guarantee:
    name: Strict Guarantee Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm test:strict-guarantee
      - run: pnpm build:strict-guarantee
      - run: pnpm test:bundlers:strict-guarantee

  perf-guardrails:
    name: Performance Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @fictjs/compiler build
      - name: Run performance guardrails
        run: BENCH_OUTPUT="${RUNNER_TEMP}/optimizer-bench.json" pnpm guardrails:perf

      - name: Upload optimizer benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/optimizer-bench.json
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - name: Run focused review regressions
        run: pnpm test:review-regressions
      - run: pnpm test:coverage

      - name: Merge package coverage reports
        run: |
          set -euo pipefail
          mkdir -p coverage
          find packages -type f -path '*/coverage/lcov.info' -print | sort > "${RUNNER_TEMP}/lcov-files"
          if [[ ! -s "${RUNNER_TEMP}/lcov-files" ]]; then
            echo "::error::No package LCOV reports were produced."
            exit 1
          fi
          xargs cat < "${RUNNER_TEMP}/lcov-files" > coverage/lcov.info
          test -s coverage/lcov.info

      - run: FICT_STRICT_GUARANTEE=1 pnpm test:bundlers

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - name: Run browser and real-application E2E
        env:
          FICT_REAL_APP_SOAK_MS: ${{ github.event_name == 'schedule' && '180000' || '10000' }}
        run: pnpm test:e2e

  test-opt-out:
    name: Test (Opt-out)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: FICT_OPT_CROSS_BLOCK_CONST=0 pnpm test

  test-ssr-edge:
    name: Test SSR Edge Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @fictjs/runtime build
      - run: pnpm --filter @fictjs/ssr build
      - run: pnpm --filter @fictjs/ssr test:edge

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout from codeload archive
        if: steps.checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::actions/checkout failed; falling back to archive download."
          archive_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${archive_url}" \
            | tar -xz -C "${tmp_dir}" --strip-components=1
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${tmp_dir}"/. .

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: FICT_STRICT_GUARANTEE=1 pnpm build
      - run: pnpm test:runtime-package-smoke
      - run: pnpm test:runtime-bundler-smoke
      - run: pnpm --filter @fictjs/router test:package

      - name: Check bundle size
        run: pnpm size
