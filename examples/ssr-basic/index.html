<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fict SSR Release Console</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color: #18212b;
        background: #eef2f5;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .release-console {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }
      .masthead,
      .panel-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }
      .masthead {
        margin-bottom: 20px;
      }
      h1,
      h2,
      p {
        margin-top: 0;
      }
      h1 {
        margin-bottom: 8px;
        font-size: 30px;
      }
      h2 {
        margin-bottom: 0;
        font-size: 18px;
      }
      .eyebrow {
        margin-bottom: 6px;
        color: #657383;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .live-indicator,
      .status {
        border: 1px solid #cbd5df;
        border-radius: 999px;
        padding: 7px 11px;
        background: white;
        color: #526170;
        font-size: 13px;
        font-weight: 800;
      }
      .live-indicator,
      .status.ready {
        border-color: #a8d7bc;
        background: #eaf8f0;
        color: #237047;
      }
      .capacity-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }
      .capacity-card,
      .panel,
      .preview-note {
        border: 1px solid #d8e0e8;
        border-radius: 9px;
        background: white;
        box-shadow: 0 1px 2px rgba(20, 30, 40, 0.05);
      }
      .capacity-card,
      .panel {
        padding: 18px;
      }
      .capacity-card > span {
        color: #657383;
        font-size: 13px;
      }
      .capacity-card > strong {
        display: block;
        margin: 9px 0 14px;
        font-size: 28px;
      }
      .capacity-actions,
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .button,
      .filter {
        border: 0;
        border-radius: 7px;
        padding: 8px 11px;
        cursor: pointer;
        font-weight: 800;
      }
      .button.primary {
        background: #275dff;
        color: white;
      }
      .button.secondary,
      .filter {
        background: #e9eef3;
        color: #263442;
      }
      .filter.active {
        background: #243346;
        color: white;
      }
      .workspace-grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.65fr) minmax(0, 1.35fr);
        gap: 16px;
      }
      .change-form {
        display: grid;
        align-content: start;
        gap: 14px;
      }
      label {
        display: grid;
        gap: 6px;
        color: #485667;
        font-size: 13px;
        font-weight: 800;
      }
      input,
      select {
        width: 100%;
        border: 1px solid #c8d2dc;
        border-radius: 7px;
        padding: 10px;
        background: #fbfcfd;
      }
      .success-note {
        margin: 0;
        color: #237047;
        font-weight: 700;
      }
      table {
        width: 100%;
        margin-top: 16px;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        padding: 10px 7px;
        border-bottom: 1px solid #e3e8ed;
        text-align: left;
      }
      th {
        color: #687686;
        font-size: 11px;
        text-transform: uppercase;
      }
      .state {
        border-radius: 999px;
        padding: 4px 8px;
        background: #eaf8f0;
        color: #237047;
        font-weight: 800;
      }
      .state.progressing {
        background: #e8f0ff;
        color: #2752a3;
      }
      .state.paused {
        background: #fff0d7;
        color: #845410;
      }
      .preview-note {
        margin-top: 16px;
        padding: 14px 16px;
        color: #5e4d21;
        background: #fff8e8;
      }
      @media (max-width: 820px) {
        .capacity-grid,
        .workspace-grid {
          grid-template-columns: 1fr;
        }
        .deployment-panel {
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <!--app-html-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
